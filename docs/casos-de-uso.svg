<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama UML de casos de uso - API Raízes do Nordeste</title>
  <desc id="desc">Atores cliente, equipe de operação, gerente e administrador vinculados aos casos de uso da API.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#18324f}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#51677f}.boundary{fill:#f6f9fc;stroke:#315b87;stroke-width:2.5}.group{fill:#e9f2fb;stroke:#bfd2e5;stroke-width:1.5}.groupname{font-size:17px;font-weight:700;fill:#244d75}.uc{fill:#fff;stroke:#4d7398;stroke-width:2}.uclabel{font-size:15px;text-anchor:middle}.assoc{fill:none;stroke:#71869a;stroke-width:1.6}.actor{stroke:#244d75;stroke-width:4;fill:none;stroke-linecap:round}.actorlabel{font-size:17px;font-weight:700;text-anchor:middle}.hint{font-size:13px;fill:#51677f}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text class="title" x="48" y="48">Casos de uso - API Raízes do Nordeste</text>
  <text class="subtitle" x="48" y="77">Atores e permissões refletem as rotas e regras implementadas no MVP</text>
  <rect class="boundary" x="300" y="110" width="1000" height="820" rx="16"/>
  <text x="330" y="145" font-size="18" font-weight="700">Sistema Back-End</text>

  <!-- Association lines are drawn behind use cases. -->
  <g class="assoc">
    <path d="M185 420 L385 220"/><path d="M185 435 L385 330"/><path d="M185 450 L385 440"/><path d="M185 465 L385 550"/><path d="M185 480 L385 660"/>
    <path d="M185 770 H250 V360 H690"/><path d="M185 770 H250 V500 H690"/><path d="M185 770 H250 V640 H690"/>
    <path d="M1415 300 H1360 V235 H1210"/><path d="M1415 315 H1375 V375 H1210"/><path d="M1415 330 H1360 V515 H1210"/>
    <path d="M1415 700 H1385 V655 H1210"/><path d="M1415 715 H1360 V790 H1210"/>
    <path d="M1413 670 H1345 V235 H1235"/><path d="M1413 675 H1355 V375 H1235"/><path d="M1413 680 H1365 V515 H1235"/>
  </g>

  <!-- Actors outside the system boundary. -->
  <g class="actor"><circle cx="145" cy="365" r="23"/><path d="M145 388 V468 M103 418 H187 M145 468 L108 520 M145 468 L182 520"/></g>
  <text class="actorlabel" x="145" y="550">Cliente</text>
  <g class="actor"><circle cx="145" cy="690" r="23"/><path d="M145 713 V793 M103 743 H187 M145 793 L108 845 M145 793 L182 845"/></g>
  <text class="actorlabel" x="145" y="875">Equipe operacional</text>
  <g class="actor"><circle cx="1455" cy="235" r="23"/><path d="M1455 258 V338 M1413 288 H1497 M1455 338 L1418 390 M1455 338 L1492 390"/></g>
  <text class="actorlabel" x="1455" y="420">Gerente</text>
  <g class="actor"><circle cx="1455" cy="635" r="23"/><path d="M1455 658 V738 M1413 688 H1497 M1455 738 L1418 790 M1455 738 L1492 790"/></g>
  <text class="actorlabel" x="1455" y="820">ADMIN</text>

  <!-- Capability groups inside the system. -->
  <rect class="group" x="330" y="170" width="300" height="610" rx="12"/><text class="groupname" x="352" y="200">Cliente</text>
  <rect class="group" x="650" y="270" width="300" height="450" rx="12"/><text class="groupname" x="672" y="300">Operação</text>
  <rect class="group" x="970" y="170" width="300" height="400" rx="12"/><text class="groupname" x="992" y="200">Gestão</text>
  <rect class="group" x="970" y="600" width="300" height="250" rx="12"/><text class="groupname" x="992" y="630">Administração</text>

  <!-- Use cases. -->
  <g><ellipse class="uc" cx="480" cy="250" rx="115" ry="33"/><text class="uclabel" x="480" y="255">Cadastrar-se e autenticar-se</text>
    <ellipse class="uc" cx="480" cy="360" rx="115" ry="33"/><text class="uclabel" x="480" y="365">Criar pedido multicanal</text>
    <ellipse class="uc" cx="480" cy="470" rx="115" ry="33"/><text class="uclabel" x="480" y="475">Pagar pedido (mock)</text>
    <ellipse class="uc" cx="480" cy="580" rx="115" ry="33"/><text class="uclabel" x="480" y="585">Consultar próprios pedidos</text>
    <ellipse class="uc" cx="480" cy="690" rx="115" ry="33"/><text class="uclabel" x="480" y="695">Gerir consentimento e pontos</text></g>
  <g><ellipse class="uc" cx="800" cy="380" rx="115" ry="33"/><text class="uclabel" x="800" y="385">Consultar pedidos e estoque</text>
    <ellipse class="uc" cx="800" cy="520" rx="115" ry="33"/><text class="uclabel" x="800" y="525">Marcar pedido como pronto</text>
    <ellipse class="uc" cx="800" cy="660" rx="115" ry="33"/><text class="uclabel" x="800" y="665">Marcar pedido como entregue</text></g>
  <g><ellipse class="uc" cx="1120" cy="250" rx="115" ry="33"/><text class="uclabel" x="1120" y="255">Gerir unidades e produtos</text>
    <ellipse class="uc" cx="1120" cy="390" rx="115" ry="33"/><text class="uclabel" x="1120" y="395">Movimentar estoque</text>
    <ellipse class="uc" cx="1120" cy="530" rx="115" ry="33"/><text class="uclabel" x="1120" y="535">Avançar status de pedidos</text>
    <ellipse class="uc" cx="1120" cy="690" rx="115" ry="33"/><text class="uclabel" x="1120" y="695">Provisionar equipe operacional</text>
    <ellipse class="uc" cx="1120" cy="800" rx="115" ry="33"/><text class="uclabel" x="1120" y="805">Consultar auditoria</text></g>

  <text class="hint" x="330" y="900">A operação depende do papel: COZINHA conclui preparo; ATENDENTE conclui entrega; GERENTE e ADMIN têm permissões gerenciais.</text>
</svg>
