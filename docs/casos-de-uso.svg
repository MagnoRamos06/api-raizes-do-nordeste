<path d="M420 582 V597" fill="none" stroke="#607d93" stroke-width="2"/>
<ellipse cx="420" cy="635" rx="128" ry="38" fill="white" stroke="#365c80" stroke-width="2"/>
<text x="420" y="641" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">Consultar pedidos</text>
<path d="M700 582 V597" fill="none" stroke="#607d93" stroke-width="2"/>
<ellipse cx="700" cy="635" rx="128" ry="38" fill="white" stroke="#365c80" stroke-width="2"/>
<text x="700" y="641" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">Registrar entrega</text>
<circle cx="110" cy="764" r="14" fill="white" stroke="#365c80" stroke-width="3"/>
<path d="M110 778 V826 M83 800 H137 M110 826 L86 861 M110 826 L134 861" fill="none" stroke="#607d93" stroke-width="2"/>
<text x="110" y="888" font-family="Arial" font-size="19" font-weight="700" text-anchor="middle" fill="#18324f">GERENTE</text>
