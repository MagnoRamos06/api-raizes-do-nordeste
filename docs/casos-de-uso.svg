<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="1170" viewBox="0 0 1350 1170" role="img"><title>Casos de uso — Raízes do Nordeste</title><rect width="1350" height="1170" fill="white"/>
<text x="30" y="45" font-family="Arial" font-size="28" font-weight="700" text-anchor="start" fill="#18324f">Casos de uso — Raízes do Nordeste</text>
<text x="30" y="80" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" fill="#18324f">Perfis de acesso e participante de pagamento simulado</text>
