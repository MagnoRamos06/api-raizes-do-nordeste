<text x="420" y="793" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">Gerir unidades</text>
<text x="420" y="813" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">e produtos</text>
<path d="M700 747 V762" fill="none" stroke="#607d93" stroke-width="2"/>
<ellipse cx="700" cy="800" rx="128" ry="38" fill="white" stroke="#365c80" stroke-width="2"/>
<text x="700" y="793" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">Consultar e</text>
<text x="700" y="813" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">movimentar estoque</text>
<path d="M980 747 V762" fill="none" stroke="#607d93" stroke-width="2"/>
<ellipse cx="980" cy="800" rx="128" ry="38" fill="white" stroke="#365c80" stroke-width="2"/>
<text x="980" y="793" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">Consultar pedidos e</text>
<text x="980" y="813" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">avançar status</text>
<circle cx="110" cy="929" r="14" fill="white" stroke="#365c80" stroke-width="3"/>
<path d="M110 943 V991 M83 965 H137 M110 991 L86 1026 M110 991 L134 1026" fill="none" stroke="#607d93" stroke-width="2"/>
<text x="110" y="1053" font-family="Arial" font-size="19" font-weight="700" text-anchor="middle" fill="#18324f">ADMIN</text>
<path d="M137 965 H225 V912 H980" fill="none" stroke="#607d93" stroke-width="2"/>
<path d="M420 912 V927" fill="none" stroke="#607d93" stroke-width="2"/>
<ellipse cx="420" cy="965" rx="128" ry="38" fill="white" stroke="#365c80" stroke-width="2"/>
<text x="420" y="958" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">Provisionar equipe</text>
<text x="420" y="978" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">e gerir catálogo/estoque</text>
<path d="M700 912 V927" fill="none" stroke="#607d93" stroke-width="2"/>
<ellipse cx="700" cy="965" rx="128" ry="38" fill="white" stroke="#365c80" stroke-width="2"/>
<text x="700" y="958" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">Consultar pedidos,</text>
<text x="700" y="978" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">pagar e avançar status</text>
<path d="M980 912 V927" fill="none" stroke="#607d93" stroke-width="2"/>
<ellipse cx="980" cy="965" rx="128" ry="38" fill="white" stroke="#365c80" stroke-width="2"/>
<text x="980" y="971" font-family="Arial" font-size="17" font-weight="400" text-anchor="middle" fill="#18324f">Consultar auditoria</text>
<text x="30" y="1120" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">O ator de pagamento representa a integração conceitual. Nesta versão, o resultado é produzido por um mock interno.</text>
<text x="30" y="1148" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">Cada perfil interno também se autentica. As associações estão agrupadas por ator para facilitar a leitura.</text>
</svg>