<text x="180.0" y="1128" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#18324f">Auditoria</text>
<text x="42" y="1168" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ usuario_id: int</text>
<text x="42" y="1193" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ acao, entidade, entidade_id: str</text>
<text x="42" y="1218" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ detalhes: str</text>
<text x="42" y="1243" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ criado_em: datetime</text>
<rect x="390" y="1100" width="300" height="170" rx="8" fill="#ffffff" stroke="#365c80" stroke-width="2"/>
<path d="M390 1142 H690" stroke="#365c80" stroke-width="1.5"/>
<text x="540.0" y="1128" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#18324f">ConsentimentoFidelidade</text>
<text x="402" y="1168" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ usuario_id: int</text>
<text x="402" y="1193" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ consentido: bool</text>
<text x="402" y="1218" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ registrado_em: datetime</text>
<rect x="750" y="1100" width="300" height="170" rx="8" fill="#ffffff" stroke="#365c80" stroke-width="2"/>
<path d="M750 1142 H1050" stroke="#365c80" stroke-width="1.5"/>
<text x="900.0" y="1128" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#18324f">MovimentoFidelidade</text>
<text x="762" y="1168" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ usuario_id, pedido_id?: int</text>
<text x="762" y="1193" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ tipo: TipoMovimentoFidelidade</text>
<text x="762" y="1218" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ pontos: int</text>
<text x="762" y="1243" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ criado_em: datetime</text>
<text x="30" y="1310" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">As referências repetem classes para evitar cruzamentos. Cada classe persistida possui id: int.</text>
<text x="30" y="1340" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">Pedido.desconto representa desconto_fidelidade. Movimentos são únicos por pedido e tipo.</text>
<text x="30" y="1370" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">As regras são funções da camada de aplicação; os modelos SQLModel não declaram métodos de negócio.</text>
</svg>