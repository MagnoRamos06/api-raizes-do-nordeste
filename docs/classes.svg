<path d="M30 202 H330" stroke="#365c80" stroke-width="1.5"/>
<text x="180.0" y="188" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#18324f">Usuario</text>
<text x="42" y="228" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ id: int</text>
<text x="42" y="253" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ nome, email: str</text>
<text x="42" y="278" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ senha_hash: str</text>
<text x="42" y="303" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ perfil: PerfilUsuario</text>
<rect x="390" y="160" width="300" height="170" rx="8" fill="#ffffff" stroke="#365c80" stroke-width="2"/>
<path d="M390 202 H690" stroke="#365c80" stroke-width="1.5"/>
<text x="540.0" y="188" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#18324f">Pedido</text>
<text x="402" y="228" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ id, usuario_id, unidade_id: int</text>
<text x="402" y="253" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ canal_pedido: CanalPedido</text>
<text x="402" y="278" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ status: StatusPedido</text>
<text x="402" y="303" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ total, desconto: Decimal</text>
<rect x="750" y="160" width="300" height="170" rx="8" fill="#ffffff" stroke="#365c80" stroke-width="2"/>
<path d="M750 202 H1050" stroke="#365c80" stroke-width="1.5"/>
<text x="900.0" y="188" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#18324f">Unidade</text>
<text x="762" y="228" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ id: int</text>
<text x="762" y="253" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ nome, endereco: str</text>
<text x="762" y="278" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ ativa: bool</text>
<rect x="30" y="430" width="300" height="170" rx="8" fill="#ffffff" stroke="#365c80" stroke-width="2"/>
<path d="M30 472 H330" stroke="#365c80" stroke-width="1.5"/>
<text x="180.0" y="458" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#18324f">Produto</text>
<text x="42" y="498" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ id: int</text>
<text x="42" y="523" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ nome, descricao: str</text>
<text x="42" y="548" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ preco: Decimal</text>
<text x="42" y="573" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ ativo: bool</text>
<rect x="390" y="430" width="300" height="170" rx="8" fill="#ffffff" stroke="#365c80" stroke-width="2"/>
<path d="M390 472 H690" stroke="#365c80" stroke-width="1.5"/>
<text x="540.0" y="458" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#18324f">ItemPedido</text>
<text x="402" y="498" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ id, pedido_id, produto_id: int</text>
<text x="402" y="523" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ quantidade: int</text>
<text x="402" y="548" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ preco_unitario: Decimal</text>
<rect x="750" y="430" width="300" height="170" rx="8" fill="#ffffff" stroke="#365c80" stroke-width="2"/>
<path d="M750 472 H1050" stroke="#365c80" stroke-width="1.5"/>
<text x="900.0" y="458" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="#18324f">Pagamento</text>
<text x="762" y="498" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ id, pedido_id: int</text>
<text x="762" y="523" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ status: StatusPagamento</text>
<text x="762" y="548" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ valor: Decimal</text>
<text x="762" y="573" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">+ payload_resposta: dict</text>
<text x="30" y="635" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">Composição: o item pertence ao pedido. O preço unitário é preservado no momento da compra.</text>
<text x="30" y="663" font-family="Arial" font-size="17" font-weight="400" text-anchor="start" fill="#18324f">Pagamento: o banco admite vários registros; o fluxo sequencial bloqueia nova tentativa após processar.</text>
<text x="30" y="716" font-family="Arial" font-size="21" font-weight="700" text-anchor="start" fill="#18324f">02  Estoque por unidade</text>
